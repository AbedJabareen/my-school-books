<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Modpack 1.12.2 - التحميل</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        /* ----- إعادة تعيين وخلفية أساسية ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #0a0000;
            font-family: 'Special Elite', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ----- طبقة الضباب المتحرك (CSS فقط) ----- */
        .fog-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .fog {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: fogMove 20s infinite alternate ease-in-out;
        }

        .fog:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #4a0000;
            top: -10%;
            left: -10%;
            animation-duration: 25s;
        }
        .fog:nth-child(2) {
            width: 800px;
            height: 800px;
            background: #2a0000;
            bottom: -20%;
            right: -10%;
            animation-duration: 30s;
            animation-delay: -5s;
        }
        .fog:nth-child(3) {
            width: 500px;
            height: 500px;
            background: #6b0000;
            top: 40%;
            left: 40%;
            animation-duration: 18s;
            animation-delay: -10s;
            opacity: 0.3;
        }
        .fog:nth-child(4) {
            width: 700px;
            height: 700px;
            background: #1a0000;
            bottom: 10%;
            left: 20%;
            animation-duration: 22s;
            animation-delay: -2s;
        }

        @keyframes fogMove {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(150px, -80px) scale(1.2) rotate(5deg); }
            66% { transform: translate(-100px, 120px) scale(0.9) rotate(-5deg); }
            100% { transform: translate(80px, -50px) scale(1.1) rotate(3deg); }
        }

        /* ----- تأثير وميض البرق (Flash) ----- */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 200, 200, 0.15);
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            animation: lightningFlash 8s infinite;
        }

        @keyframes lightningFlash {
            0%, 92%, 94%, 96%, 100% { opacity: 0; }
            93% { opacity: 1; }
            95% { opacity: 0.8; }
            97% { opacity: 0.3; }
        }

        /* ----- قماش الجسيمات (العيون والظلال) ----- */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ----- البطاقة الأساسية (الكونتينر) ----- */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(139, 0, 0, 0.6);
            border-radius: 40px;
            padding: 60px 70px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 80px rgba(139, 0, 0, 0.4), inset 0 0 60px rgba(80, 0, 0, 0.3);
            animation: cardFadeIn 1.5s ease-out;
            transition: 0.4s;
        }

        .card:hover {
            box-shadow: 0 0 120px rgba(200, 0, 0, 0.6), inset 0 0 80px rgba(100, 0, 0, 0.4);
            border-color: #8b0000;
        }

        @keyframes cardFadeIn {
            0% { opacity: 0; transform: scale(0.8) rotateY(10deg); }
            100% { opacity: 1; transform: scale(1) rotateY(0); }
        }

        /* ----- العناوين والنصوص ----- */
        .title {
            font-family: 'Creepster', cursive;
            font-size: 4rem;
            color: #d42a2a;
            text-shadow: 0 0 30px #ff0000, 0 0 60px #8b0000, 0 0 100px #4a0000;
            letter-spacing: 4px;
            margin-bottom: 5px;
            animation: titleGlitch 3s infinite;
        }

        @keyframes titleGlitch {
            0%, 90%, 95%, 100% { text-shadow: 0 0 30px #ff0000, 0 0 60px #8b0000; }
            92% { text-shadow: 4px -4px 0 #ff0000, -4px 4px 0 #8b0000, 0 0 80px #ff4444; transform: skewX(-2deg); }
            94% { text-shadow: -4px 2px 0 #ff0000, 4px -2px 0 #8b0000, 0 0 80px #ff4444; transform: skewX(2deg); }
        }

        .subtitle {
            font-size: 1.4rem;
            color: #aa7a7a;
            text-shadow: 0 0 20px #330000;
            margin-bottom: 15px;
            letter-spacing: 2px;
            border-top: 1px solid #3a1a1a;
            border-bottom: 1px solid #3a1a1a;
            padding: 12px 0;
            font-family: 'Special Elite', cursive;
        }

        .warning {
            color: #6a3a3a;
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 30px;
            border: 1px solid #2a0a0a;
        }

        /* ----- زر التحميل الرهيب ----- */
        .download-btn {
            display: inline-block;
            padding: 22px 60px;
            background: linear-gradient(145deg, #7a0000, #3a0000);
            color: #f0c0c0;
            font-family: 'Creepster', cursive;
            font-size: 2.2rem;
            letter-spacing: 3px;
            text-decoration: none;
            border-radius: 60px;
            border: 2px solid #b30000;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.3), inset 0 0 20px rgba(255, 0, 0, 0.2);
            transition: all 0.2s ease;
            animation: btnPulse 1.8s infinite ease-in-out, btnShake 4s infinite;
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 20px #ff0000;
            margin-top: 10px;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,0,0,0.1), transparent, rgba(200,0,0,0.1), transparent);
            animation: spinGlow 6s linear infinite;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .download-btn:hover {
            transform: scale(1.08) !important;
            background: linear-gradient(145deg, #a00000, #5a0000);
            box-shadow: 0 0 80px rgba(255, 0, 0, 0.7), inset 0 0 40px rgba(255, 50, 50, 0.3);
            color: #ffffff;
            border-color: #ff4444;
            animation-play-state: paused;
        }

        .download-btn:active {
            transform: scale(0.95) !important;
            background: #1a0000;
        }

        .download-btn span {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .download-btn .icon {
            font-size: 2.8rem;
            line-height: 1;
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.3), inset 0 0 20px rgba(255, 0, 0, 0.2); }
            50% { box-shadow: 0 0 80px rgba(255, 0, 0, 0.6), inset 0 0 40px rgba(255, 0, 0, 0.4); }
        }

        @keyframes btnShake {
            0%, 85%, 90%, 95%, 100% { transform: translateX(0) rotate(0deg); }
            87% { transform: translateX(-5px) rotate(-1deg); }
            92% { transform: translateX(5px) rotate(1deg); }
            97% { transform: translateX(-3px) rotate(0deg); }
        }

        /* ----- تذييل مخيف ----- */
        .footer-text {
            margin-top: 30px;
            color: #4a2a2a;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border-top: 1px dashed #2a0a0a;
            padding-top: 18px;
            font-family: 'Special Elite', cursive;
        }

        .footer-text span {
            color: #7a3a3a;
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
            80% { opacity: 0.8; }
        }

        /* ----- توافق مع الشاشات الصغيرة ----- */
        @media (max-width: 600px) {
            .card { padding: 30px 20px; }
            .title { font-size: 2.5rem; }
            .subtitle { font-size: 1rem; }
            .download-btn { font-size: 1.4rem; padding: 16px 30px; }
            .download-btn .icon { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- طبقات الضباب -->
    <div class="fog-container">
        <div class="fog"></div>
        <div class="fog"></div>
        <div class="fog"></div>
        <div class="fog"></div>
    </div>

    <!-- وميض البرق -->
    <div class="flash-overlay"></div>

    <!-- قماش الجسيمات (Canvas) -->
    <canvas id="particleCanvas"></canvas>

    <!-- البطاقة الرئيسية -->
    <div class="card">
        <h1 class="title">☠️ HORROR</h1>
        <h1 class="title" style="margin-top: -20px; font-size: 3.2rem;">MODPACK</h1>
        <div class="subtitle">⚰️ الإصدار 1.12.2 ⚰️</div>
        <div class="warning">⚠️ يحتوي على محتوى مرعب و أصوات مخيفة ⚠️</div>

        <!-- زر التحميل -->
        <a href="HorrorModpack1.12.2.zip" download class="download-btn">
            <span>
                <span class="icon">🔻</span>
                تحميل المجلد
                <span class="icon">💀</span>
            </span>
        </a>

        <div class="footer-text">
            <span>✝️</span> اضغط واجه الظلام... <span>✝️</span>
            <br>
            <span style="font-size: 0.7rem; color: #2a1a1a;">(سيبدأ التحميل فوراً بعد الضغط)</span>
        </div>
    </div>

    <script>
        // ----- جسيمات الخلفية (عيون متحركة في الظلام) -----
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const PARTICLE_COUNT = 75;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 4 + 1.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                // لون بين الأحمر الداكن والبرتقالي الخافت
                this.color = `hsla(${Math.random() * 20 + 340}, 80%, ${Math.random() * 20 + 15}%, ${Math.random() * 0.5 + 0.2})`;
                // بعض الجسيمات تكون "عيون" بوهج أكبر
                this.isEye = Math.random() > 0.7;
                if (this.isEye) {
                    this.size = Math.random() * 6 + 4;
                    this.color = `hsla(0, 90%, ${Math.random() * 20 + 40}%, 0.7)`;
                }
                this.life = 0;
                this.maxLife = Math.random() * 300 + 200;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life++;

                // ارتداد بسيط عن الحواف مع إعادة تعيين تدريجية
                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;

                // توهج إضافي للعيون
                if (this.isEye) {
                    this.size += Math.sin(this.life * 0.05) * 0.1;
                }

                // إعادة ضبط الجسيم إذا تجاوز عمره الافتراضي
                if (this.life > this.maxLife) {
                    this.reset();
                    this.life = 0;
                }
            }

            draw() {
                ctx.beginPath();
                // رسم توهج للعيون
                if (this.isEye) {
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                    gradient.addColorStop(0, 'rgba(255, 50, 50, 0.8)');
                    gradient.addColorStop(0.3, 'rgba(200, 0, 0, 0.4)');
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // الجسيم الأساسي
                ctx.shadowColor = this.isEye ? '#ff0000' : '#3a0000';
                ctx.shadowBlur = this.isEye ? 25 : 10;
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // إنشاء الجسيمات
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        // إعادة ضبط الجسيمات عند تغيير حجم الشاشة لتجنب الخروج عن الحدود
        window.addEventListener('resize', () => {
            resizeCanvas();
            particles.forEach(p => {
                p.x = Math.min(p.x, width);
                p.y = Math.min(p.y, height);
            });
        });
    </script>

</body>
</html>
